          An interactive AI risk universe that helps audit teams explore and select relevant AI risks for audit planning.
        description: |
          AIRUM helps translate broad AI risk taxonomies into inputs for risk-based audit planning. Auditors can explore a risk landscape, review source-backed examples and select relevant risks. The linked demonstration uses a reduced example dataset; the complete data core and detailed methodology are not included.

