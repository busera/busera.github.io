        caption: Jul 2024
        link: https://medium.com/@buser.andre
        link_text: medium.com
        description: |
          Best practices for splitting datasets in machine learning projects. Covers train/validation/test splits, stratification, time-series considerations, and common pitfalls that lead to data leakage.

      - layout: left
        border: weak
        title: Data Ethics Checklist
        sub_title: Case Study
        caption: Jul 2021
        link: github.com/busera/mads__data_science_ethics_checklist
        link_text: github.com
        #quote: >
        #  Originally developed in April 2021 as part of the University of Michigan's Master of Applied Data Science program, SIADS501 - Being a Data Scientist course. This manifesto continues to guide my practice and is regularly updated to reflect new insights and evolving best practices in the field.
        description: |
          A Data Ethics Checklist for data science projects, built for MADS SIADS593 (Ethics). Structured around the CRISP-DM model, it walks through ethical questions at each project phase: data collection, preparation, modeling, evaluation, and deployment. Covers transparency, accountability, fairness, and explainability.
      
