# about_title: About Me
about_profile_image: images/profile_andre_buser.jpeg
about_content: | # this will include new lines to allow paragraphs
  I lead AI governance audits in a global pharmaceutical organisation, assessing whether accountability, risk frameworks and controls work in practice. My focus is clear evidence, sound professional judgment and priorities for action.

  My experience spans internal audit, information security and risk management, and global security. Earlier leadership responsibilities included an international team of 15, vendor governance and SOX IT compliance. That experience informs how I assess the relationship between governance, operational practice and assurance.

  A Master of Applied Data Science from the University of Michigan supports my ability to examine the evidence behind AI-related decisions. I also develop practitioner projects that explore risk-based audit planning and reviewable AI-supported fieldwork. Technical understanding supports the professional judgment; it does not replace it.

  Alongside my corporate role, I serve on the advisory board at CISS LTD and participate in Plateforme Tripartite, contributing to discussions on AI governance, ethics and digital innovation across industry, academia and regulators.

