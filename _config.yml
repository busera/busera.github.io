      - layout: left
        border: weak
        title: AEOS
        sub_title: AI-Augmented Engagement Operating System
        caption: September 2026
        link: https://busera.github.io/aeos/
        link_text: Explore AEOS
        quote: >
          Governed AI support for audit fieldwork, with professional authority retained by the auditor.
        description: |
          AEOS supports audit fieldwork from an existing engagement work program through evidence gathering, testing, workpaper preparation, review and reporting drafts. It keeps the work connected to its sources and open decisions, while professional judgment, conclusions and approval remain with the auditor.

      - layout: left
